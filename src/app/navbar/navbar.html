<header class="site-header">

  <!-- =====================================================
       TOP BLUE BAR
  ====================================================== -->
  <div class="top-nav">

    <!-- LEFT SECTION -->
    <div class="top-nav-left">

      <!-- Language -->
      <div class="language-selector">
        <span class="flag"><img src="https://shop.drivemedical.com/_ui/responsive/common/images/flag.png" alt="Flag"/></span>

        <span class="language-text">
          US EN
        </span>

        <svg class="down-arrow" viewBox="0 0 20 20">
          <path d="M5 7L10 12L15 7"
                fill="none"
                stroke="currentColor"
                stroke-width="2"/>
        </svg>
      </div>


      <!-- Locate Providers -->
      <div class="top-item">

        <svg class="location-icon" viewBox="0 0 24 24">
          <path d="M12 21s7-6.2 7-12A7 7 0 0 0 5 9c0 5.8 7 12 7 12z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"/>

          <circle cx="12"
                  cy="9"
                  r="2.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"/>
        </svg>

        <span>Locate Providers</span>

      </div>


      <!-- Chat -->
      <div class="top-item">

        <svg class="chat-icon" viewBox="0 0 28 24">
          <path d="M14 2C7.4 2 2 6.2 2 11.4c0 3 1.8 5.7 4.7 7.4L5 22l4.7-2.1c1.3.4 2.8.6 4.3.6 6.6 0 12-4.2 12-9.1S20.6 2 14 2z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"/>
          
          <circle cx="9" cy="11.5" r="1" fill="currentColor"/>
          <circle cx="14" cy="11.5" r="1" fill="currentColor"/>
          <circle cx="19" cy="11.5" r="1" fill="currentColor"/>
        </svg>

        <span>Chat</span>

      </div>


      <!-- Inspired By Drive -->
      <div class="top-item inspired-drive">
        Inspired By Drive
      </div>

    </div>


    <!-- RIGHT SECTION -->
    <div class="top-nav-right">

      <!-- Order Status -->
      <div class="top-item">

        <svg class="box-icon" viewBox="0 0 28 28">
          <path d="M4 8L14 3L24 8L14 13L4 8Z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"/>

          <path d="M4 8V20L14 25L24 20V8"
                fill="none"
                stroke="currentColor"
                stroke-width="2"/>

          <path d="M14 13V25"
                fill="none"
                stroke="currentColor"
                stroke-width="2"/>
        </svg>

        <span>Order Status</span>

      </div>


      <!-- Sign In -->
      <div class="top-item">

        <svg class="user-icon" viewBox="0 0 28 28">

          <circle cx="14"
                  cy="9"
                  r="4.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"/>

          <path d="M5 24C5 18.5 9 16 14 16C19 16 23 18.5 23 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"/>
        </svg>

        <span>Sign In</span>

      </div>


      <!-- Cart -->
      <div class="cart-section">

        <svg class="cart-icon" viewBox="0 0 30 28">

          <path d="M3 4H7L10 19H24L27 8H8"
                fill="none"
                stroke="currentColor"
                stroke-width="2"/>

          <circle cx="11"
                  cy="24"
                  r="1.8"
                  fill="currentColor"/>

          <circle cx="22"
                  cy="24"
                  r="1.8"
                  fill="currentColor"/>

        </svg>

        <span>Cart</span>

      </div>


      <!-- Cart Count -->
      <div class="cart-count">

        <span>0</span>

      </div>

    </div>

  </div>


  <!-- =====================================================
       MAIN WHITE NAVIGATION
  ====================================================== -->
  <div class="main-nav">


    <!-- LOGO -->
    <div class="logo-container">

      <img
        src="https://shop.drivemedical.com/medias/sys_master/images/hd2/hd9/11058069209118/Drive_Medical_Logo_Blue/Drive-Medical-Logo-Blue.png"
        alt="Drive Medical"
        class="logo"
      >

    </div>


    <!-- NAVIGATION -->
    <nav class="navigation-links">

      <a href="#">
        PRODUCTS
      </a>

      <a href="#">
        SUPPORT &amp; SERVICES
      </a>

      <a href="#">
        WHO WE SERVE
      </a>

      <a href="#">
        WHO WE ARE
      </a>

    </nav>


    <!-- SEARCH -->
    <div class="search-container">

      <!-- Input -->
      <input
        type="text"
        placeholder="Search keyword, UPC or item #"
      >


      <!-- Category -->
      <div class="search-category">

        <span>
          In: Products
        </span>

        <svg class="search-down-arrow" viewBox="0 0 20 20">
          <path d="M5 7L10 12L15 7"
                fill="none"
                stroke="currentColor"
                stroke-width="2"/>
        </svg>

      </div>


      <!-- Search Button -->
      <button
        type="button"
        class="search-button"
        aria-label="Search">

        <svg viewBox="0 0 28 28">

          <circle cx="12"
                  cy="12"
                  r="7"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"/>

          <path d="M17.5 17.5L24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"/>

        </svg>

      </button>

    </div>

  </div>

</header>
